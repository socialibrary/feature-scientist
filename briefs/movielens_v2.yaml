# Feature Scientist brief: MovieLens-1M, fresh-hypothesis round (v2).
#
# Context: the deterministic iteration driver exhausted its 8-candidate pool
# with 0 features accepted (revert gate overturned the single-seed phantom,
# degenerate guard caught the train-constant feature). This brief hands the
# proposer the Wikidata-enriched catalog the iteration pool never explored
# with the LLM: directors 99%, cast 95%, awards 24%, box office 27%,
# budget 32%, release_date 99%, original_language 98% coverage -- with the
# honest temporal_scope annotations the leakage audit enforces.
#
# Run:  python3 src/brief.py briefs/movielens_v2.yaml --backend nebius
#         (needs Nebius Token Factory credential; ~8-epoch ablations on CPU)

problem: "predict P(user likes movie) for ranking"
label: "liked = rating >= 4, observed at rating timestamp"
prediction_time: "score at impression time T; features may only use data with timestamp <= T"

tables:
  - name: ratings
    schema_text: "user_id INT, movie_id INT, rating INT (1-5), timestamp BIGINT -- 1,000,209 rows, 2000-04 to 2001-02"
  - name: users
    schema_text: "user_id INT, gender STRING, age INT (bucket code), occupation INT (coded 0-20), zip STRING -- 6,040 rows, static demographics"
  - name: movies
    schema_text: "movie_id INT, title STRING (with release year), genres STRING (pipe-separated) -- ~3,900 rows"
  - name: imdb_enrichment
    schema_text: "movieId INT, tconst STRING, startYear FLOAT, runtimeMinutes FLOAT, directors STRING, imdb_averageRating FLOAT (ALL-TIME aggregate, leakage if used raw), imdb_numVotes FLOAT (ALL-TIME, leakage if used raw) -- 86% of movies"
  - name: wikidata_movies
    schema_text: "tconst STRING (= imdb_enrichment.tconst, 99% matched), wikidata_qid STRING, directors STRING (QIDs |-sep, 99%, time_invariant, lookup), cast STRING (QIDs |-sep, 95%, time_invariant, lookup), awards STRING (QIDs |-sep, 24%, ALL_TIME as of crawl -- FAIL-CLOSED: wins may postdate T), box_office_amount FLOAT (27%, ALL-TIME final gross, MIXED CURRENCIES -- leakage if raw), budget_amount FLOAT (32%, time_invariant in principle but very sparse), release_date STRING (P577 YYYY-MM-DD, 99%, time_invariant, lookup), original_language STRING (P364 QID, 98%, time_invariant, lookup)"

engine: llm
backend: nebius
model: torch

serving: {per_feature_budget: 8, total_budget: 15}
stop_when: {max_rounds: 3, stop_on_no_signal: true}
